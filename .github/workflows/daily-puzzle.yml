name: Daily puzzle

# Picks a fresh random article and stores it as the daily puzzle.
on:
  schedule:
    # We want the daily to roll over at LOCAL midnight (Europe/Amsterdam), but
    # GitHub cron is UTC-only and has no DST. Amsterdam is UTC+1 (CET, winter) or
    # UTC+2 (CEST, summer), so local midnight is 23:00 UTC in winter and 22:00 UTC
    # in summer. We schedule BOTH; whichever lands on local 00:00 does the work and
    # the other is a cheap no-op (the picker computes "today" in Amsterdam time and
    # exits early when that date's dailies already exist — so it never re-picks).
    - cron: "0 22 * * *"   # = 00:00 CEST (summer) / 23:00 CET (winter, prior day → no-op)
    - cron: "0 23 * * *"   # = 00:00 CET  (winter) / 01:00 CEST (summer, already done → no-op)
  workflow_dispatch: {}       # ...and a manual "Run workflow" button

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # no install step needed — the script uses only built-in fetch + fs
      - name: Pick today's puzzle
        run: node scripts/pick-daily.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # the picker no longer generates hints — the game does that lazily via the
          # "hint" Edge Function, so the Groq key lives with the function, not here.

      # Hard-delete accounts whose deletion was requested >7 days ago (cancelable
      # until then). Idempotent + runs on both cron times (the 2nd finds nothing).
      - name: Purge accounts past the deletion grace period
        run: node scripts/purge-deletions.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
