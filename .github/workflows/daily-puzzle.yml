name: Daily puzzle

# Picks a fresh random article and stores it as the daily puzzle.
on:
  schedule:
    # 23:00 UTC = just after local midnight in Amsterdam year-round
    # (00:00 CET in winter, 01:00 CEST in summer). GitHub cron is UTC-only and
    # has no DST, and 23:00 is the earliest time that's still after midnight in
    # winter — so the picker always runs on the correct local day.
    - cron: "0 23 * * *"
  workflow_dispatch: {}       # ...and a manual "Run workflow" button

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # no install step needed — the script uses only built-in fetch + fs
      - name: Pick today's puzzle
        run: node scripts/pick-daily.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # optional — enables a vague AI hint; the picker runs fine without it
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
